name: Payment reminders
on:
  schedule:
    - cron: '0 14 * * *' # 9am Central (8am during standard time)
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node live/scripts/send-reminders.mjs
        env:
          FELT_CLUB_PASSCODE: ${{ secrets.FELT_CLUB_PASSCODE }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
